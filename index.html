<!DOCTYPE html>
<html lang="ja" data-hero="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TSUBAKIMORI HOTEL</title>
  <!-- ヘッダー写真：最初の1枚は日本時間の時間帯で描画前に決め、その後は数秒ごとにスライドショーで切り替える -->
  <script id="heroTime">
  (function () {
    var root = document.documentElement;
    var ORDER = ['day', 'evening', 'night'];
    var INTERVAL_MS = 5000;
    var FADE_MS = 1200;   // CSS の .hero-fade の transition と合わせる
    var LABELS = {
      day:     'TSUBAKIMORI HOTEL ラウンジ',
      evening: 'TSUBAKIMORI HOTEL アーチの先のレセプション',
      night:   'TSUBAKIMORI HOTEL レンガ壁のロゴサイン'
    };
    // 端末のタイムゾーンに依存しないよう UTC + 9 で判定
    function slot() {
      var h = (new Date().getUTCHours() + 9) % 24;
      if (h >= 5 && h < 16) return 'day';      // 5:00〜16:00 ラウンジ
      if (h >= 16 && h < 19) return 'evening'; // 16:00〜19:00 アーチ
      return 'night';                          // 19:00〜5:00 レンガ壁
    }
    function src(s) { return 'images/hero-' + s + '.jpg'; }
    function label() {
      var el = document.getElementById('hero');
      if (el) el.setAttribute('aria-label', LABELS[root.getAttribute('data-hero')] || LABELS.day);
    }

    var first = slot();
    root.setAttribute('data-hero', first);
    try {
      var link = document.createElement('link');
      link.rel = 'preload'; link.as = 'image'; link.href = src(first);
      document.head.appendChild(link);
    } catch (e) {}

    // 次の写真を読み込んでから上の層に重ねてフェードし、終わったら下の層（data-hero）を差し替える
    function startSlideshow() {
      label();
      var hero = document.getElementById('hero');
      if (!hero) return;
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      } catch (e) {}
      var fade = document.createElement('div');
      fade.className = 'hero-fade';
      fade.setAttribute('aria-hidden', 'true');
      hero.appendChild(fade);
      var busy = false;
      setInterval(function () {
        if (busy || document.hidden) return;
        var next = ORDER[(ORDER.indexOf(root.getAttribute('data-hero')) + 1) % ORDER.length];
        var img = new Image();
        busy = true;
        img.onload = function () {
          fade.style.backgroundImage = 'url(' + src(next) + ')';
          void fade.offsetWidth;   // 透明な状態を確定させてからフェードを始める（これが無いと切り替えが瞬時になることがある）
          fade.classList.add('is-on');
          setTimeout(function () {
            root.setAttribute('data-hero', next);
            label();
            fade.classList.remove('is-on');
            busy = false;
          }, FADE_MS);
        };
        img.onerror = function () { busy = false; };
        img.src = src(next);
      }, INTERVAL_MS);
    }
    document.addEventListener('DOMContentLoaded', startSlideshow);
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ──
       デザイン（.ai 5枚目）: 幅 1290px のアートボード = 画面幅 430px の 3 倍。
       --u はデザインの 1px を画面上の長さに換算した値（アプリ幅 ÷ 1290、最大 480px 幅） */
    :root {
      --pink:       #DEA7A9;   /* 地色（公式サイト tsubakimori-hotel.com のピンク） */
      --green:      #59AF92;   /* トンマナの緑。住所の帯（公式サイトの緑） */
      --rose-deep:  #9A5357;   /* リンク・チップ・小見出し用の濃いピンク（白地 5.6:1） */
      --pink-pale:  #F8EDED;   /* タグ・チップの地 */
      --pink-tint:  #FFFFFF;   /* 囲み枠の地（淡いピンクの詳細ページの上なので白） */
      --panel-bg:   #F7ECED;   /* 詳細ページの地（ピンクで統一する指定） */
      --white:      #FFFFFF;
      --ink:        #131313;   /* 見出し・ボタン（公式サイトの黒） */
      --text:       #333333;   /* 本文 */
      --muted:      #6B6B6B;   /* 注記（白地 5.3:1） */
      --font-ja:  'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif;
      --font-en:  'Poppins', 'Century Gothic', var(--font-ja);   /* トンマナ: 欧文は Poppins、和文は Zen Kaku Gothic New（見出しは 700・本文は 400） */
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
      --u: calc(min(100vw, 480px) / 1290);
      --radius: 14px;
      --col-bg: linear-gradient(90deg,
                  var(--pink) calc(50% - 240px), var(--panel-bg) calc(50% - 240px),
                  var(--panel-bg) calc(50% + 240px), var(--pink) calc(50% + 240px));
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-ja);
      background: var(--pink);
      color: var(--text);
      min-height: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body.panel-open { overflow: hidden; }

    /* ── APP SHELL（PC では 480px で中央寄せ、両側はピンク） ── */
    .app {
      max-width: 480px;
      margin: 0 auto;
      background: var(--pink);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ── HERO（最初の1枚は時間帯で決め、その後スライドショー。CSS 背景なので最初は該当の1枚だけ読み込まれる） ── */
    .hero {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1290 / 511;
      background: #CDBBA5 url(images/hero-day.jpg) center / cover no-repeat;
    }
    [data-hero="evening"] .hero { background-color: #C9A48F; background-image: url(images/hero-evening.jpg); }
    [data-hero="night"]   .hero { background-color: #3A2A22; background-image: url(images/hero-night.jpg); }

    /* 次の写真を重ねてフェードさせる層（時間は JS の FADE_MS と合わせる） */
    .hero-fade {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: center / cover no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hero-fade.is-on { opacity: 1; }

    /* ── HOTEL INFO（緑の帯に白抜き文字：デザイン y 511〜739） ── */
    .hotel-info {
      background: var(--green);
      padding: calc(64 * var(--u)) calc(85 * var(--u)) calc(58 * var(--u));
    }

    .hotel-name {
      font-family: var(--font-en);
      font-size: max(14px, calc(52 * var(--u)));
      font-weight: 700;
      letter-spacing: .03em;
      line-height: 1.2;
      color: var(--white);
    }

    .hotel-address {
      font-family: var(--font-en);
      font-size: max(10px, calc(27 * var(--u)));
      font-weight: 400;
      line-height: 1.25;
      color: var(--white);
      margin-top: calc(11 * var(--u));
    }

    /* ── MENU GRID（カード 350 角・間隔 45・左右 75：デザイン実測） ── */
    .menu-section {
      background: var(--pink);
      padding: calc(62 * var(--u)) calc(75 * var(--u));
      padding-bottom: calc(284 * var(--u) + env(safe-area-inset-bottom, 0px));
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: calc(45 * var(--u));
    }

    .menu-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 1px solid var(--white);
      border-radius: calc(39 * var(--u));
      background: transparent;
      color: var(--white);
      font: inherit;
      text-align: center;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .15s ease, transform .15s ease;
    }

    /* aspect-ratio 非対応（iOS 14 以前）では高さ 0 になるため、padding で比率を保つ */
    @supports not (aspect-ratio: 1 / 1) {
      .hero      { height: 0; padding-top: 39.612%; }   /* 511 / 1290 */
      .menu-card { height: 0; padding-top: 100%; }
    }

    .menu-card:active { background: rgba(255,255,255,.18); transform: scale(.97); }
    .menu-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    @media (hover: hover) {
      .menu-card:hover { background: rgba(255,255,255,.12); }
    }

    /* アイコンはカード全体（350×350）の座標で描いているので、カードに重ねるだけで位置が合う */
    .card-icon {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 日本語ラベル：中心がカード上端から 65.4%。2行に折り返したときは上へ伸びる */
    .card-label {
      position: absolute;
      left: 3%;
      right: 3%;
      bottom: calc(34.6% - .625em);
      font-family: var(--font-ja);
      font-size: max(9px, calc(25 * var(--u)));
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: .05em;
      padding-left: .05em;
      word-break: keep-all;
      color: inherit;
    }

    /* 細い横線：上端から 74.9%、左右 10.6% あけ */
    .card-rule {
      position: absolute;
      left: 10.63%;
      right: 10.63%;
      top: 74.9%;
      border-top: .5px solid currentColor;
    }

    /* 英語ラベル：中心がカード上端から 85.4%。
       Poppins は Futura PT より字幅が広いので、デザインの 27px を 25px 相当にして幅を合わせる（狭い端末では下限 9px）。
       1行に収まらないラベルは MENU の en に改行を入れて 2 行にする */
    .card-en {
      position: absolute;
      left: 2%;
      right: 2%;
      top: 85.4%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-family: var(--font-en);
      font-size: max(9px, calc(25 * var(--u)));
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: .05em;
      padding-left: .05em;
      color: inherit;
    }

    /* 2行の長い英語ラベル（Check-in / Check-out、Amenities & Items available on request）はカード幅に収まる大きさに */
    .card-en--long { font-size: max(8px, calc(23 * var(--u))); }

    /* 幅の狭い端末では字間を詰めて、はみ出しを防ぐ */
    @media (max-width: 399px) {
      .card-label, .card-en { letter-spacing: .01em; padding-left: 0; }
    }
    @media (max-width: 339px) {
      .card-label, .card-en { font-size: 8px; }
      .card-en--long { font-size: 7px; }
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--pink);
      transform: translateX(100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      z-index: 200;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-panel.open { transform: translateX(0); }

    .detail-header {
      flex-shrink: 0;
      background: var(--col-bg);
      border-bottom: 1px solid var(--pink);
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-left: max(calc(16px + env(safe-area-inset-left, 0px)), calc(50% - 224px));
      padding-right: max(calc(16px + env(safe-area-inset-right, 0px)), calc(50% - 224px));
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--rose-deep);
      background: var(--white);
      color: var(--rose-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }

    .back-btn:active { background: var(--pink-pale); }
    .back-btn:focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 2px; }

    .detail-title {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-title-text {
      font-family: var(--font-ja);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .05em;
      line-height: 1.35;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-title-en {
      font-family: var(--font-en);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      line-height: 1.3;
      color: var(--rose-deep);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-title-en:empty { display: none; }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: var(--col-bg);
      padding: 28px 20px;
      padding-left: max(calc(20px + env(safe-area-inset-left, 0px)), calc(50% - 220px));
      padding-right: max(calc(20px + env(safe-area-inset-right, 0px)), calc(50% - 220px));
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      overflow-wrap: anywhere;
    }

    /* ── DETAIL CONTENT ATOMS（クラス名は LIVE DATA の処理と共通。見た目だけ変更） ── */
    .dc-concept-en {
      font-family: var(--font-en);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 18px;
    }

    .dc-h1 {
      font-family: var(--font-en);
      font-size: 38px;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 24px;
    }

    /* 公式サイトのコンセプト欄に合わせた見せ方：ラベル下の2色の線、2色のタイトル、太字のリード文 */
    .dc-concept-en::after {
      content: '';
      display: block;
      width: 28px;
      height: 3px;
      margin-top: 8px;
      background: linear-gradient(90deg, var(--pink) 50%, var(--green) 50%);
    }
    .dc-h1-pink  { color: var(--pink); }
    .dc-h1-green { color: var(--green); }

    .dc-concept-lead {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: .04em;
      color: var(--ink);
    }

    .dc-concept-body {
      font-size: 15px;
      line-height: 1.95;
      color: var(--ink);
    }

    .dc-concept-body p { margin-bottom: 18px; }
    .dc-concept-body p:last-child { margin-bottom: 0; }

    .dc-section-title {
      font-family: var(--font-en);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .05em;
      line-height: 1.5;
      color: var(--ink);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--pink);
      margin: 32px 0 14px;
    }

    .dc-section-title:first-child { margin-top: 0; }

    .dc-subsection {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--rose-deep);
      margin: 18px 0 8px;
    }

    .dc-p {
      font-size: 15px;
      line-height: 1.85;
      color: var(--text);
      margin-bottom: 12px;
    }

    .dc-p:last-child { margin-bottom: 0; }

    /* 本文のうち英語だけの行は、日本語と見分けやすいよう小さめにする（色は日本語と同じ） */
    .dc-en, .dc-p-en {
      font-family: var(--font-en);
      font-size: 13px;
    }
    .dc-p-en { line-height: 1.75; }
    .dc-p strong, .dc-concept-body strong { font-weight: 700; color: var(--ink); }

    .dc-ul {
      margin: 0 0 12px;
      padding-left: 1.2em;
    }

    .dc-ul li {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      margin-bottom: 6px;
    }

    .dc-ul li::marker { color: var(--rose-deep); }

    /* wifi：トップのカードと同じピンク地＋白い細線。文字は黒で読みやすく */
    .wifi-card {
      background: var(--pink);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin: 4px 0 24px;
      text-align: center;
      color: var(--ink);
    }

    .wifi-row { margin: 8px 0; }

    .wifi-lbl {
      font-family: var(--font-en);
      font-size: 12px;
      font-weight: 400;
      color: #1A1A1A;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .wifi-val {
      font-family: var(--font-mono);   /* l と I、0 と O を見分けやすく */
      font-size: 21px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: .04em;
      word-break: break-all;
    }

    .wifi-divider {
      height: 0;
      border-top: 1px solid var(--white);
      margin: 18px 12px;
    }

    /* checkin/out */
    .cio-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      margin: 4px 0 20px;
    }

    .cio-box {
      background: var(--pink);
      border-radius: var(--radius);
      padding: 20px 10px 18px;
      text-align: center;
      color: var(--ink);
    }

    .cio-lbl {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .05em;
      color: #1A1A1A;
      margin-bottom: 6px;
    }

    .cio-time {
      font-family: var(--font-en);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.1;
    }

    .cio-note {
      font-size: 12px;
      color: #1A1A1A;
      line-height: 1.5;
      margin-top: 6px;
    }

    .cio-en {
      font-family: var(--font-en);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      background: var(--pink-tint);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    /* floor guide */
    .floor-list {
      list-style: none;
      padding: 0;
      margin: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--pink);
      background: var(--white);
    }

    .floor-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--pink-pale);
    }

    .floor-item:last-child { border-bottom: none; }

    .floor-f {
      font-family: var(--font-en);
      font-size: 18px;
      font-weight: 700;
      color: var(--rose-deep);
      width: 34px;
      flex-shrink: 0;
      text-align: center;
    }

    .floor-desc {
      font-size: 14px;
      color: #1A1A1A;
      line-height: 1.5;
    }

    /* シートのセル内で改行した 2 行目以降（英語）は、日本語の下に小さく出す */
    .floor-en {
      display: block;
      font-family: var(--font-en);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 2px;
    }

    /* info box */
    .info-box {
      border: 1px solid var(--pink);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 8px 0 18px;
      background: var(--white);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px;
      border-bottom: 1px solid var(--pink-pale);
      gap: 12px;
    }

    .info-row:last-child { border-bottom: none; }

    .info-lbl {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .info-val {
      font-size: 14px;
      font-weight: 400;
      color: #1A1A1A;
      text-align: right;
      line-height: 1.6;
    }

    /* amenity tags */
    .tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 16px;
    }

    .tag {
      display: inline-block;
      background: var(--white);
      color: var(--rose-deep);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* venue */
    .venue {
      border: 1px solid var(--pink);
      border-radius: var(--radius);
      padding: 16px;
      margin: 12px 0;
      background: var(--white);
    }

    .venue-name {
      font-family: var(--font-en);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .venue-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .link-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 38px;
      padding: 8px 16px;
      background: var(--white);
      color: var(--rose-deep);
      border: 1px solid var(--pink-pale);
      border-radius: 999px;
      font-family: var(--font-en);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: .03em;
      line-height: 1.3;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s;
    }

    .link-chip:active { opacity: .7; }
    .link-chip:focus-visible, .btn:focus-visible, .tel-link:focus-visible, .tel-inline:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .link-chip-pdf {
      background: var(--white);
      border-color: var(--rose-deep);
      color: var(--rose-deep);
    }

    /* buttons（公式サイトと同じ黒い丸型。btn-green も同じ色にそろえる） */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-family: var(--font-ja);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .05em;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      margin: 14px 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s, transform .1s;
    }

    .btn:active { opacity: .85; transform: scale(.98); }
    .btn-rose,
    .btn-green  { background: var(--ink); color: var(--white); }

    /* tel */
    .tel-link {
      display: inline-block;
      font-family: var(--font-en);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--rose-deep);
      text-decoration: underline;
      text-decoration-color: var(--pink);
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
      margin: 6px 0 16px;
    }

    .tel-inline {
      color: var(--rose-deep);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--pink);
      text-underline-offset: 3px;
    }

    /* dish */
    .dish-item {
      background: var(--pink-tint);
      border-left: 2px solid var(--pink);
      border-radius: 0 12px 12px 0;
      padding: 13px 16px;
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.6;
      color: #1A1A1A;
    }

    /* misc */
    .note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
    }

    .divider {
      height: 0;
      border-top: 1px solid var(--pink);
      margin: 22px 0;
    }

    .hl-box {
      background: var(--pink-tint);
      border-radius: var(--radius);
      padding: 16px;
      margin: 10px 0 18px;
    }

    .artist-card {
      border-left: 2px solid var(--pink);
      padding-left: 14px;
      margin: 16px 0;
    }

    .artist-name {
      font-family: var(--font-en);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .artist-role {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .artist-desc {
      font-size: 14px;
      color: var(--text);
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: var(--white);
      color: var(--rose-deep);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 400;
    }

    @media (prefers-reduced-motion: reduce) {
      .detail-panel, .menu-card, .btn { transition: none; }
    }
  </style>
</head>

    /* ========================================================
       LIVE DATA — スプレッドシート（GAS 経由）の内容で各ページを差し替える。
       起動時は「最後に取得できたデータ全体（localStorage）」を先に当て、裏で最新を取得する。
       どちらのデータでも組み立てられなかったページは、上の組み込み内容のまま。
    ======================================================== */
    var DATA_URL  = 'https://script.google.com/macros/s/AKfycbwO-l6e3Ms6ojPGq8clRR6WnyUt5SERaCGqARF951fVkii5zHW6pjVhkrUYSirLArI/exec?format=json';
    var CACHE_KEY = 'tsubakimori-sheets-v1';
    var FETCH_TIMEOUT_MS = 8000;

    var SOURCES = [
      { idx: 0,  sheet: 'コンセプト',                   build: liveIntro },
      { idx: 1,  sheet: 'art&music',                    build: liveArt },
      { idx: 2,  sheet: 'Wi-Fi',                        build: liveWifi },

      { idx: 4,  sheet: '館内のご案内',                 build: liveFloor },
      { idx: 5,  sheet: '貸出備品／アメニティ',         build: function (r) { return liveGeneric(r, '詳しく見る', false); } },
      { idx: 6,  sheet: 'レストラン／バー',             build: liveRestaurant },
      { idx: 7,  sheet: '朝食',                         build: function (r) { return liveGeneric(r, 'メニューを見る', false); } },
      { idx: 8,  sheet: 'ルームサービス',               build: function (r) { return liveGeneric(r, '詳しく見る', false); } },

      { idx: 11, sheet: '口コミ',                       build: function (r) { return liveGeneric(r, '口コミを書く（Google レビュー）', true); } }
    ];

    /* ---- helpers ---- */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function cellText(v) {
      return String(v == null ? '' : v).replace(/\r\n?/g, '\n').trim();
    }

    function rowTexts(row) { return row.map(cellText); }

    function cellsOf(rows) {
      var out = [];
      rows.forEach(function (row) {
        rowTexts(row).forEach(function (t) { if (t) out.push(t); });
      });
      return out;
    }

    function firstNonEmpty(list) {
      for (var i = 0; i < list.length; i++) if (list[i]) return list[i];
      return '';
    }

    function isUrl(s) { return /^https?:\/\/[^\s"'<>]+$/i.test(s); }

    function isDriveFile(url)   { return /drive\.google\.com\/file\//i.test(url); }
    function isDriveFolder(url) { return /drive\.google\.com\/drive\/folders\//i.test(url); }

    function linkLabel(url, hint) {
      if (/instagram\.com/i.test(url)) return 'Instagram';
      if (/maps\.app\.goo\.gl|google\.[a-z.]+\/maps/i.test(url)) return 'Google Map';
      if (hint && !isUrl(hint) && hint.indexOf('\n') < 0) return hint;
      return 'Webサイト';
    }

    function chip(url, label, outlined) {
      return '<a class="link-chip' + (outlined ? ' link-chip-pdf' : '') + '" href="' + esc(url) +
             '" target="_blank" rel="noopener">' + esc(label) + '</a>';
    }

    function button(url, label) {
      return '<a class="btn btn-rose" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
    }

    // 前後が数字・ハイフンでないものだけ（「2025-03-1234」などは電話番号にしない）
    var PHONE_RE = /(?:^|[^\d-])(0\d{1,4}-\d{1,4}-\d{3,4})(?![\d-])/;

    function telHref(phone) { return 'tel:' + phone.replace(/-/g, ''); }

    // ひらがな・カタカナ・漢字を含まず、英単語が 2 つ以上ある行を「英語の行」とみなす。
    // URL・メールアドレスは語に数えず、Wi-Fi・Check-in のようにハイフンでつないだ語は 1 語と数える
    function isEnglishLine(s) {
      if (/[\u3040-\u30ff\u3400-\u9fff]/.test(s)) return false;
      var words = s.replace(/https?:\/\/\S+|[^\s@]+@[^\s@]+/gi, ' ').match(/[A-Za-z]{2,}(?:-[A-Za-z]+)*/g);
      return !!words && words.length >= 2;
    }

    /* セル内の文章を、見出し・小見出し・注記・タグ・段落に組み立てる */
    function renderText(text) {
      var html = '', para = [];
      // 段落がすべて英語なら段落ごと小さく、日本語と混ざる段落は英語の行だけ小さくする
      function flush() {
        if (!para.length) return;
        var allEn = para.every(function (l) { return l.en; });
        html += allEn
          ? '<p class="dc-p dc-p-en" lang="en">' + para.map(function (l) { return l.h; }).join('<br>') + '</p>'
          : '<p class="dc-p">' + para.map(function (l) {
              return l.en ? '<span class="dc-en" lang="en">' + l.h + '</span>' : l.h;
            }).join('<br>') + '</p>';
        para = [];
      }
      text.split('\n').forEach(function (raw) {
        var line = raw.trim();
        var phone, items;
        if (!line) { flush(); return; }
        if (line.charAt(0) === '【' && line.indexOf('】') > 0 && line.length <= 40) {
          flush();
          html += '<h3 class="dc-section-title">' + esc(line.replace(/[【】]/g, ' ').replace(/\s+/g, ' ').trim()) + '</h3>';
          return;
        }
        if (line.charAt(0) === '■') {
          flush();
          html += '<p class="dc-subsection">' + esc(line.replace(/^■\s*/, '')) + '</p>';
          return;
        }
        if (line.charAt(0) === '※') {
          flush();
          html += '<p class="note">' + esc(line) + '</p>';
          return;
        }
        items = line.split(/／|\s{2,}/).map(function (s) { return s.trim(); }).filter(Boolean);
        if ((line.match(/／/g) || []).length >= 2 && items.length >= 3) {
          flush();
          html += '<div class="tag-wrap">' + items.map(function (s) {
            return '<span class="tag">' + esc(s) + '</span>';
          }).join('') + '</div>';
          return;
        }
        phone = line.match(PHONE_RE);
        if (phone && /^(TEL|電話)/i.test(line) && line.replace(/^(TEL|電話(番号)?)\s*[：:]?\s*/i, '') === phone[1]) {
          flush();
          html += '<p><a class="tel-link" href="' + telHref(phone[1]) + '">' + esc(phone[1]) + '</a></p>';
          return;
        }
        if (phone) {
          var at = line.indexOf(phone[1], phone.index);
          para.push({ en: isEnglishLine(line), h: esc(line.slice(0, at)) +
            '<a class="tel-inline" href="' + telHref(phone[1]) + '">' + esc(phone[1]) + '</a>' +
            esc(line.slice(at + phone[1].length)) });
          return;
        }
        para.push({ en: isEnglishLine(line), h: esc(line) });
      });
      flush();
      return html;
    }

    function isShortLabel(s) { return s.indexOf('\n') < 0 && s.length <= 40; }

    function isHeading(s) {
      return s.indexOf('\n') < 0 && s.length <= 30 &&
             !/^[【■※]/.test(s) && !/[。．.!！?？]$/.test(s) && !/\d{1,2}:\d{2}/.test(s);
    }

    /* セルを上から順に：URL→ボタン、「〇〇はこちら」+URL→ラベル付きボタン、短い1行→見出し、他→本文 */
    function renderCells(cells, defaultLabel) {
      var html = '', links = 0, body = 0, t;
      for (var i = 0; i < cells.length; i++) {
        var c = cells[i], next = cells[i + 1];
        if (isUrl(c)) { html += button(c, defaultLabel); links++; continue; }
        if (next && isUrl(next) && isShortLabel(c)) {
          html += button(next, c.replace(/は(こちら|コチラ)[。！!]?$/, ''));
          links++; i++;
          continue;
        }
        if (isHeading(c)) { html += '<h3 class="dc-section-title">' + esc(c) + '</h3>'; continue; }
        t = renderText(c);
        if (/class="(dc-p|dc-p dc-p-en|tag-wrap|note|tel-link)"/.test(t)) body++;
        html += t;
      }
      return { html: html, links: links, body: body };
    }

    /* ---- page builders（null を返すと、そのページは差し替えない） ---- */
    function liveGeneric(rows, defaultLabel, needsLink) {
      var r = renderCells(cellsOf(rows), defaultLabel);
      // 見出しだけのページや、リンク必須のページにリンクが無いときは差し替えない
      if (!(r.body + r.links) || (needsLink && !r.links)) return null;
      return r.html;
    }

    function liveIntro(rows) {
      var title = '', started = false, paras = [], para = [];
      function flush() { if (para.length) { paras.push(para.join('<br>')); para = []; } }
      rows.forEach(function (row) {
        var c = rowTexts(row);
        if (!started) {
          for (var k = 0; k < c.length; k++) {
            if (c[k].toLowerCase() === 'concept') { title = firstNonEmpty(c.slice(k + 1)); started = true; break; }
          }
          return;
        }
        var text = c.filter(Boolean).join('\n');
        if (!text) { flush(); return; }
        para.push(esc(text).replace(/\n/g, '<br>'));
      });
      flush();
      if (!title || !paras.length) return null;
      return '<p class="dc-concept-en">concept</p>' +
             '<h2 class="dc-h1">' + conceptTitle(title) + '</h2>' +
             '<div class="dc-concept-body">' +
               '<p class="dc-concept-lead">' + paras[0] + '</p>' +
               (paras.length > 1 ? '<p>' + paras.slice(1).join('</p><p>') + '</p>' : '') +
             '</div>';
    }

    /* 公式サイトに合わせ、タイトルの最初の単語をピンク、残りを緑にする（例：Unusual / Usual） */
    function conceptTitle(title) {
      var words = String(title).trim().split(/\s+/);
      if (words.length < 2) return esc(title);
      return '<span class="dc-h1-pink">' + esc(words[0]) + '</span> ' +
             '<span class="dc-h1-green">' + esc(words.slice(1).join(' ')) + '</span>';
    }

    function liveArt(rows) {
      var sections = [], cur = null, artist = null, total = 0;
      rows.forEach(function (row) {
        var c = rowTexts(row);
        if (/^(art|music)$/i.test(c[0] || '')) {
          cur = { title: c[0], music: /^music$/i.test(c[0]), artists: [] };
          sections.push(cur);
          artist = null;
          return;
        }
        if (!cur) return;
        var urls  = c.filter(isUrl);
        var texts = c.filter(function (t) { return t && !isUrl(t); });
        if (c[1] && !isUrl(c[1])) {
          artist = {
            role: c[0] || '',
            name: c[1],
            links: urls,
            desc: c.slice(2).filter(function (t) { return t && !isUrl(t); })
          };
          cur.artists.push(artist);
          total++;
          return;
        }
        if (!artist) return;
        artist.links = artist.links.concat(urls);
        artist.desc  = artist.desc.concat(texts);
      });
      if (!total) return null;
      return sections.filter(function (s) { return s.artists.length; }).map(function (s) {
        return '<h3 class="dc-section-title">' + esc(s.title) + '</h3>' + s.artists.map(function (a) {
          var links = a.links.map(function (u) {
            if (isDriveFile(u))   return chip(u, s.music ? '紹介 PDF' : 'アーティスト紹介 PDF', true);
            if (isDriveFolder(u)) return chip(u, s.music ? '音源フォルダ' : '資料フォルダ', true);
            return chip(u, linkLabel(u), false);
          }).join('');
          return '<div class="artist-card">' +
                   '<p class="artist-name">' + esc(a.name) + '</p>' +
                   (a.role ? '<p class="artist-role">' + esc(a.role) + '</p>' : '') +
                   a.desc.map(function (d) {
                     return '<p class="artist-desc">' + esc(d).replace(/\n/g, '<br>') + '</p>';
                   }).join('') +
                   (links ? '<div class="link-row">' + links + '</div>' : '') +
                 '</div>';
        }).join('');
      }).join('');
    }

    function liveWifi(rows) {
      var ssid = '', pass = '';
      rows.forEach(function (row) {
        var c = rowTexts(row);
        for (var k = 0; k < c.length; k++) {
          var key = c[k].replace(/[：:\s]/g, '').toUpperCase();
          var val = firstNonEmpty(c.slice(k + 1));
          if (!val) continue;
          if (!ssid && (key === 'ID' || key === 'SSID')) ssid = val;
          if (!pass && (key === 'PASS' || key === 'PASSWORD' || key === 'パスワード')) pass = val;
        }
      });
      if (!ssid || !pass) return null;
      return (
        '<div class="wifi-card">' +
          '<div class="wifi-row"><p class="wifi-lbl">SSID</p><p class="wifi-val">' + esc(ssid) + '</p></div>' +
          '<div class="wifi-divider"></div>' +
          '<div class="wifi-row"><p class="wifi-lbl">PASSWORD</p><p class="wifi-val">' + esc(pass) + '</p></div>' +
        '</div>' +
        '<p class="note">ご不明な点はフロントまでお気軽にお申し付けください。</p>'
      );
    }

    function liveCIO(rows) {
      var inText = '', outText = '';
      cellsOf(rows).forEach(function (t) {
        if (/【\s*CHECK\s*-?\s*IN\s*】/i.test(t)) inText = t;
        else if (/【\s*CHECK\s*-?\s*OUT\s*】/i.test(t)) outText = t;
      });
      var inTime  = (inText.match(/\d{1,2}:\d{2}/) || [])[0];
      var outTime = (outText.match(/\d{1,2}:\d{2}/) || [])[0];
      if (!inTime || !outTime) return null;
      var suite = (outText.match(/スイート[^\n]*?(\d{1,2}:\d{2})/) || [])[1];
      return (
        '<div class="cio-grid">' +
          '<div class="cio-box"><p class="cio-lbl">チェックイン</p><p class="cio-time">' + esc(inTime) + '</p><p class="cio-note">以降</p></div>' +
          '<div class="cio-box"><p class="cio-lbl">チェックアウト</p><p class="cio-time">' + esc(outTime) + '</p>' +
            '<p class="cio-note">まで' + (suite ? '<br>（スイートは ' + esc(suite) + '）' : '') + '</p></div>' +
        '</div>' +
        renderText(inText) + renderText(outText)
      );
    }

    function liveFloor(rows) {
      var floors = [], rest = [], title = 'フロアガイド';
      rows.forEach(function (row) {
        var c = rowTexts(row);
        if (/^B?\d+\s*F$/i.test(c[0] || '') && c[1]) {
          floors.push({ f: c[0].replace(/\s+/g, '').toUpperCase(), desc: c[1] });
          return;
        }
        c.forEach(function (t) { if (t) rest.push(t); });
      });
      if (!floors.length) return null;
      rest = rest.filter(function (t) {
        var m = t.match(/^【([^】]*フロア[^】]*)】$/);
        if (m) { title = m[1].trim(); return false; }
        return true;
      });
      return (
        '<h3 class="dc-section-title">' + esc(title) + '</h3>' +
        '<ul class="floor-list">' + floors.map(function (f) {
          // 1 行目（日本語）と、セル内で改行した 2 行目以降（英語）を分けて縦に並べる
          var lines = f.desc.split('\n').map(function (t) { return t.trim(); }).filter(Boolean);
          var en = lines.slice(1).join(' ');
          return '<li class="floor-item"><span class="floor-f">' + esc(f.f) + '</span><span class="floor-desc">' + esc(lines[0] || '') +
            (en ? '<span class="floor-en" lang="en">' + esc(en) + '</span>' : '') + '</span></li>';
        }).join('') + '</ul>' +
        renderCells(rest, '詳しく見る').html
      );
    }

    function liveRestaurant(rows) {
      var html = '', venue = null, count = 0, linkCount = 0;
      function close() {
        if (!venue) return;
        html += '<div class="venue">' +
                  '<p class="venue-name">' + esc(venue.name) + '</p>' +
                  (venue.desc ? '<p class="venue-desc">' + esc(venue.desc) + '</p>' : '') +
                  (venue.links.length ? '<div class="link-row">' + venue.links.join('') + '</div>' : '') +
                '</div>';
        venue = null;
      }
      rows.forEach(function (row) {
        var c = rowTexts(row);
        var name = c[0] || '';
        var links = [];
        for (var k = 1; k < c.length; k++) {
          if (isUrl(c[k])) links.push(chip(c[k], linkLabel(c[k], c[k - 1]), false));
        }
        var hasOther = c.slice(1).some(function (t) { return t; });
        if (name && !hasOther) {
          close();
          html += '<h3 class="dc-section-title">' + esc(name.split('\n')[0]) + '</h3>';
          return;
        }
        if (name) {
          close();
          venue = { name: name, desc: (c[1] && !isUrl(c[1])) ? c[1] : '', links: [] };
          count++;
        }
        if (venue) { venue.links = venue.links.concat(links); linkCount += links.length; }
      });
      close();
      // 店名はあってもリンクが1つも無いのは、シートの書き方が崩れているとみなす
      return (count && linkCount) ? html : null;
    }

    /* ---- apply / load ---- */
    function applyData(data) {
      var sheets = data && data.sheets;
      var applied = 0;
      if (!sheets || typeof sheets !== 'object') return 0;
      SOURCES.forEach(function (src) {
        var rows = sheets[src.sheet];
        if (!Array.isArray(rows)) return;
        try {
          var html = src.build(rows.map(function (r) { return Array.isArray(r) ? r : []; }));
          if (html) { MENU[src.idx].content = html; applied++; }
        } catch (e) { /* このページは今の内容のまま */ }
      });
      return applied;
    }

    function applyCached() {
      try {
        var text = localStorage.getItem(CACHE_KEY);
        if (text) applyData(JSON.parse(text));
      } catch (e) {}
    }

    function loadLive() {
      if (!window.fetch) return;
      var ctrl  = window.AbortController ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS) : null;
      fetch(DATA_URL, ctrl ? { signal: ctrl.signal } : undefined)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          if (!applyData(JSON.parse(text))) return;
          try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}
          // 開いたばかり（スクロール前）のページだけ、その場で新しい内容に替える
          if (isOpen && openIdx >= 0 && bodyEl.scrollTop === 0) {
            bodyEl.innerHTML = MENU[openIdx].content;
          }
        })
        .catch(function () { /* 通信できないときは今の内容のまま */ })
        .then(function () { if (timer) clearTimeout(timer); });
    }

    applyCached();
    loadLive();

    /* Handle direct hash on load */
    (function () {
      var hash = location.hash.replace('#', '').toLowerCase();
      var idx  = -1;
      for (var i = 0; i < MENU.length; i++) if (MENU[i].slug === hash) idx = i;
      // 以前の番号付き URL（#0〜#11）も開けるようにしておく
      if (idx < 0 && /^\d+$/.test(hash) && +hash < MENU.length) idx = +hash;
      if (idx < 0) return;
      // 直接開いたときは、戻る先をトップ（#なし）にする
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      openPanel(idx);
    })();

  })();
  </script>
</body>
